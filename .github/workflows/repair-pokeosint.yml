name: Repair uploaded Pokémon archive part
on:
  push:
    paths:
      - '.github/workflows/repair-pokeosint.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore first part and verify entire archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dest="Srdnlen CTF Finals 2026/OSINT-P0k3h34rtge0s1nt"
          : > "$dest/pokeosint.zip.001"
          for sha in
            ab6fb66d4897bb7afccc56bcb2c51d197ad70903
            d3662361165ec2cf30114aac06c074dd76648d8f
            34d029955aefeb2d027675659d2e5109e775e978
            f61fa6358db820f69cd01361cb5ea75fcfc2d7f8
            45b1ebe253441b4432b6a16af0b85ecc8f9f2787
            768757bf33bd5c89057339d6b82550ea01eb6f6d
            6603c2cb15e31799f83aff45a4980741d6cb3987
            eb842921e36aa2f456ddc3269fd500ae52b96db9
            97065e6e2c5aa66c45fdf07fa091702be606d657
            aab499e39821157e1c3338eb6f4f3a7006d831a5
            29ca8fc449481c9d35bf12dc9d355c12a03ff6de
            1d66cc9e68142318344e51c05e0548acb037ee74
          do
            curl -fsSL --retry 3 --retry-delay 1 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/paveledits/Writeups/git/blobs/$sha" | jq -r '.content' | base64 -d >> "$dest/pokeosint.zip.001"
          done
          echo "815880a68dfe01c8d41aada36003ddee069bba4d1b4b62180ffb0718a5964b70  $dest/pokeosint.zip.001" | sha256sum -c -
          echo "ad80df48c9197bd5c847a107de05fad5ec4de0ddb2296b37e4b3d4a1cfd60c24  $dest/pokeosint.zip.002" | sha256sum -c -
          echo "3a39e6a52782fc4e06865ed32c78654a78911a1e771521d219ea69f20abdadb5  $dest/pokeosint.zip.003" | sha256sum -c -
          cat "$dest"/pokeosint.zip.00{1,2,3} > "$RUNNER_TEMP/rebuilt.zip"
          echo "c72ba3677209a113f9a29ec9f3964fb1d3191b630cf23bf14e6e5aefb201cd9f  $RUNNER_TEMP/rebuilt.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/rebuilt.zip"
          git add -- "$dest/pokeosint.zip.001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace damaged first archive part with verified bytes"
          git push origin HEAD:main
